services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
    - "8086:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
    ports:
      - "8091:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
